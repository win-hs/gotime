<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoTime：開工吉時</title>
<meta name="description" content="GoTime 開工吉時：生態調查出勤時機查詢。日出日落、曙暮光、月相、潮汐、鄉鎮天氣與雷達回波一頁看完，並依自訂規則算出調查時段、匯出行事曆。">
<link rel="canonical" href="https://win-hs.github.io/gotime/">
<meta property="og:title" content="GoTime：開工吉時">
<meta property="og:description" content="日出日落、曙暮光、月相、潮汐、天氣與雷達回波一頁看完，並算出你的調查時段。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://win-hs.github.io/gotime/">
<meta property="og:locale" content="zh_TW">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-bar">
  <div class="app-bar-brand">
    <img class="app-bar-logo" src="logo.svg" alt="" width="32" height="32">
    <h1 class="app-bar-title">GoTime：開工吉時</h1>
  </div>
  <nav class="app-bar-actions">
    <a class="md-btn" href="https://sites.google.com/view/fieldbox/homepage">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
      返回 Field-Box 首頁
    </a>
    <a class="md-btn" href="mailto:a.wen90@gmail.com?subject=Field-Box%20%E5%9B%9E%E5%A0%B1%EF%BC%9AGoTime">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      回報問題
    </a>
    <span class="visit-chip">總造訪次數<b id="visits">00000000</b></span>
  </nav>
</header>

<div class="wrap">

  <!-- ===== 上方：位置 ＋ 控制 ===== -->
  <div class="top-grid">

    <section class="panel">
      <h2 class="panel-h">位置</h2>
      <div id="map"></div>
      <div class="loc-label" id="coord-label"></div>
      <form class="loc-row" id="coord-form" autocomplete="off">
        <div class="search-wrap">
          <input type="text" id="coord-input" placeholder="地名或座標"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
          <div class="suggest" id="suggest" role="listbox"></div>
        </div>
        <button type="submit" class="md-btn-out">搜尋</button>
        <button type="button" class="md-btn-out" id="locate-btn">定位</button>
        <div class="fav-wrap">
          <button type="button" class="md-btn-out fav-toggle" id="fav-toggle">
            <span id="fav-current">常用地點</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="fav-menu" id="fav-menu"></div>
        </div>
        <button type="button" class="md-btn-out" id="fav-add">★ 加入</button>
      </form>
    </section>

    <section class="panel">
      <h2 class="panel-h">開工吉時</h2>
      <div class="date-row">
        <button class="md-btn-out" id="today-btn">今天</button>
        <button class="md-btn-out icon-only" id="prev-day" title="前一天">◀</button>
        <input type="date" id="date-input">
        <button class="md-btn-out icon-only" id="next-day" title="後一天">▶</button>
        <span class="grow"></span>
        <div class="seg" id="range-seg"></div>
      </div>

      <div class="toggle-row">
        <label class="ck"><input type="checkbox" class="card-ck" data-id="obs"> 即時觀測</label>
        <label class="ck"><input type="checkbox" class="card-ck" data-id="weather"> 天氣</label>
        <label class="ck"><input type="checkbox" class="card-ck" data-id="moon"> 月相</label>
        <label class="ck"><input type="checkbox" class="card-ck" data-id="sun"> 日出/落</label>
        <label class="ck"><input type="checkbox" class="card-ck" data-id="tide"> 潮汐</label>
        <span class="grow"></span>
        <button class="md-chip" id="radar-btn">雷達回波開啟</button>
      </div>

      <div class="plan-summary" id="plan-summary"></div>

      <div class="panel-foot">
        <button class="md-btn-out" id="rules-btn">調查規劃</button>
        <div class="share-wrap">
          <button class="md-btn-fill" id="share-btn">分享開工吉時 ▾</button>
          <div class="share-menu" id="share-menu">
            <button type="button" class="share-item" data-m="text">複製純文字</button>
            <button type="button" class="share-item" data-m="image">複製分享圖</button>
            <button type="button" class="share-item" data-m="link">複製本頁面連結</button>
            <button type="button" class="share-item" data-m="ics">匯出 .ics 行事曆</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- ===== 卡片 ===== -->
  <section class="card" id="card-obs">
    <h2><span class="h-title">🌡️ 即時觀測</span>
      <span class="h-tools">
        <span class="src-tag">中央氣象署</span>
        <a class="md-chip" id="lnk-radar" target="_blank" rel="noopener">雷達回波</a>
        <a class="md-chip" id="lnk-qpf" target="_blank" rel="noopener">定量降水預報</a>
        <span class="src-tag">NCDR</span>
        <a class="md-chip" id="lnk-rain" target="_blank" rel="noopener">落雨小幫手</a>
        <button class="md-chip" id="obs-refresh">重新整理</button>
      </span></h2>
    <div class="card-body" id="obs-body"></div>
  </section>

  <section class="card" id="card-multi">
    <h2><span class="h-title">📅 天氣預報</span>
      <span class="h-tools"><div class="seg" id="range-seg2"></div></span></h2>
    <div class="card-body" id="multi-body"></div>
  </section>

  <section class="card" id="card-hourly">
    <h2><span class="h-title">📈 溫度曲線</span>
      <span class="h-tools"><div class="seg" id="range-seg3"></div></span></h2>
    <div class="card-body" id="hourly-body"></div>
  </section>

  <div class="cards">
    <section class="card" id="card-sun">
      <h2>☀️ 日出/落</h2>
      <div class="card-body" id="sun-body"></div>
    </section>

    <section class="card" id="card-moon">
      <h2><span class="h-title">🌗 月相</span>
        <span class="h-tools"><button class="md-chip" id="moon-month-btn">月相表</button></span></h2>
      <div class="card-body" id="moon-body"></div>
    </section>
  </div>

  <section class="card" id="card-tide">
    <h2><span class="h-title">🌊 潮汐</span>
      <span class="h-tools"><button class="md-chip" id="tide-month-btn">潮汐表</button></span></h2>
    <div class="card-body" id="tide-body"></div>
  </section>

  <footer>
    日月時刻為本機天文計算，時區固定臺灣時間（+08:00）；
    天氣、潮汐、雨量與雷達回波來自中央氣象署開放資料。
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-head">
      <h3 id="overlay-title"></h3>
      <button id="overlay-close" class="md-btn-out icon-only" aria-label="關閉">✕</button>
    </div>
    <div class="overlay-body" id="overlay-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/suncalc.js"></script>
<script src="js/config.js"></script>
<script src="js/settings.js"></script>
<script src="js/moonpos.js"></script>
<script src="js/astro.js"></script>
<script src="js/geo.js"></script>
<script src="js/cwa.js"></script>
<script src="js/radar.js"></script>
<script src="js/observe.js"></script>
<script src="js/forecast.js"></script>
<script src="js/hourly.js"></script>
<script src="js/plan.js"></script>
<script src="js/share.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
